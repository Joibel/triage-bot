version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Core
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security
    - gosec
    - bidichk

    # Error handling
    - errorlint
    - errchkjson
    - nilerr
    - wrapcheck

    # Code quality
    - revive
    - gocritic
    - unconvert
    - unparam
    - prealloc
    - dupl
    - goconst
    - wastedassign

    # Complexity
    - gocyclo
    - gocognit
    - funlen
    - nestif

    # Style
    - misspell
    - whitespace
    - godot
    - nakedret
    - nonamedreturns
    - dogsled
    - grouper
    - tagliatelle

    # Bug prevention
    - bodyclose
    - contextcheck
    - noctx
    - copyloopvar
    - durationcheck
    - sqlclosecheck
    - asasalint
    - containedctx
    - forcetypeassert
    - makezero
    - mirror
    - nosprintfhostport

    # Modernization
    - modernize
    - intrange
    - exptostd

    # Testing
    - thelper
    - tparallel
    - testifylint

    # Logging/Metrics
    - loggercheck
    - promlinter

    # Interfaces
    - ireturn

    # Globals
    - gochecknoglobals

    # Exhaustiveness
    - exhaustive

    # Miscellaneous
    - dupword
    - godox
    - goprintffuncname
    - nolintlint
    - predeclared
    - reassign
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true
      # `_ = f.Close()` is how Go says "this error was considered and is being
      # deliberately dropped". Flagging it too leaves no way to express that
      # except a nolint on every best-effort cleanup path.
      check-blank: false
      exclude-functions:
        # Formatted output to stdout/stderr: a failed write to a closed pipe is
        # not actionable, and checking every Fprintf in the CLI output code
        # obscures it.
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

    govet:
      enable-all: true
      disable:
        # Field order in this project's structs is chosen for readability and,
        # for the YAML schema types, determines the key order in the status
        # file that humans read and edit. Reordering fields to save a few bytes
        # of padding would make that file arbitrary.
        - fieldalignment

    tagliatelle:
      case:
        rules:
          # snake_case throughout: it is the convention for the status file, and
          # bd's JSON output (close_reason, external_ref) is snake_case and not
          # ours to change.
          yaml: snake
          json: snake

    exhaustive:
      # A default case is a deliberate statement that the remaining values need
      # no special handling, which is exactly how the enum switches here are
      # written.
      default-signifies-exhaustive: true

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 100

    nakedret:
      max-func-lines: 30

    goconst:
      min-len: 3
      min-occurrences: 3

    gosec:
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)

    revive:
      rules:
        # Error handling
        - name: error-return
        - name: error-strings
        - name: error-naming

        # Naming
        - name: var-naming
        - name: receiver-naming
        - name: time-naming

        # Imports
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports

        # Documentation
        - name: package-comments
        - name: exported

        # Complexity
        - name: cyclomatic
          arguments:
            - 15
        - name: cognitive-complexity
          arguments:
            - 20

        # Code structure
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: early-return
        - name: indent-error-flow

        # Style
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-naming
        - name: bare-return
        - name: identical-branches

        # Bug prevention
        - name: range-val-in-closure
        - name: range-val-address
        - name: waitgroup-by-value
        - name: atomic
        - name: defer
        - name: unconditional-recursion

  exclusions:
    rules:
      # Test files can have longer functions and similar test patterns
      - path: _test\.go
        linters:
          - goconst
          - unparam
          - errcheck
          - noctx
          - thelper
          # Table-driven tests are long and repetitive by design.
          - funlen
          - gocognit
          - dupl
          # Integration tests shell out with test-controlled arguments.
          - gosec

      # Build info package uses globals set via ldflags at build time
      - path: internal/buildinfo/
        linters:
          - gochecknoglobals

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Joibel/triage-bot

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
